[package]
name = "google-chat-tauri"
version = "1.1.0"
description = "Unofficial desktop app for Google Chat."
authors = ["ankurk91"]
license = "GPL-3.0-only"
repository = "https://github.com/ankurk91/google-chat-tauri"
edition = "2024"
# The floor, not a preference: the highest MSRV anything in Cargo.lock asks for.
# notify-rust 4.18 sets it, with image, time, plist and the icu crates just
# behind at 1.88. Keep it identical to the channel in rust-toolchain.toml at the
# repo root -- that is the compiler CI, the release and you actually use, so
# building at the floor is what keeps this number from going stale. When a
# dependency update raises its MSRV the build fails outright; raise both numbers
# together rather than pinning the crate back.
#
# It also has a floor of its own that no dependency will announce: edition 2024
# needs 1.85, so this cannot go below that however light the tree gets.
rust-version = "1.89"

[lib]
name = "app_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png", "image-ico"] }
tauri-plugin-opener = "2.5"
tauri-plugin-clipboard-manager = "2.3"
tauri-plugin-dialog = "2.7"
tauri-plugin-log = "2.9"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
# Resolves the app data directories before there is an AppHandle to ask.
# The same version Tauri itself depends on, so it adds nothing to the build.
dirs = "7"
# Update checks: one small blocking HTTP call, twice a day. native-tls rather
# than rustls so TLS comes from the platform -- OpenSSL on Linux, which
# WebKitGTK already pulls in, Schannel on Windows, Security.framework on macOS.
# That keeps the binary small and the trust store the user's own.
ureq = { version = "3.2", default-features = false, features = ["native-tls", "json"] }
# Comparing a release tag against our own version. Already in the tree via Tauri.
semver = "1"
# Download names arrive percent-encoded, because that is how a URL path carries
# them. Already in the tree via `url`, so it adds nothing to the build.
percent-encoding = "2"

# `cfg(desktop)` is a Tauri-defined cfg, not one cargo can select a target on.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = "2.4"
tauri-plugin-window-state = "2.4"
tauri-plugin-autostart = "2.5"

# macOS/Windows notifications. The plugin handles the macOS bundle-id and the
# Windows AUMID plumbing, which is the fiddly part of getting a toast to appear
# under the right app name.
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tauri-plugin-notification = "2"

# Linux goes direct to notify-rust instead, because the plugin exposes no way to
# learn that a notification was clicked -- its action/listener API is documented
# as mobile-only. Talking to the freedesktop daemon ourselves gets that back.
[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4"

# Windows menu accelerators never reach tao's message loop, so Quit and
# close-to-tray are asked of WebView2 through `AcceleratorKeyPressed`; see
# `features::accelerators` for the measurement. Tauri hands out the
# `ICoreWebView2Controller` and types it with this crate, so the version has to
# be the one Tauri resolves -- a mismatch is two incompatible copies of the same
# COM interface, and the call will not typecheck. It is already in the tree via
# Tauri and adds nothing to the build.
[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"

[features]
default = []
# `pnpm tauri dev` enables devtools automatically; this is for release debugging.
devtools = ["tauri/devtools"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
# Also why every Mutex here is locked with `unwrap`: a panic ends the process,
# so no thread survives to leave a lock poisoned. See the note on `AppState`.
panic = "abort"
strip = true
