name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # 22.04, not latest: building on 24.04 pins glibc >= 2.39, which would
          # exclude Ubuntu 22.04 and Linux Mint 21. If this runner is retired,
          # move up and say so in the release notes.
          - platform: ubuntu-22.04
            args: '--bundles deb,appimage'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file \
            build-essential libssl-dev

      # Reads the version from package.json's "packageManager" field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      # Bundles are selected per platform above rather than from
      # tauri.conf.json, so a host can never emit a target we do not ship
      # (notably rpm, which is deliberately not supported).
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Google Chat ${{ github.ref_name }}'
          releaseBody: |
            Builds are unsigned. macOS will need right-click > Open on first
            launch; Windows will show a SmartScreen warning.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
