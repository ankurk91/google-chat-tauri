name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Only the build job may write, and only to publish the draft release.
permissions:
  contents: read

# Never cancel a release build: a half-uploaded draft is worse than a slow one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        include:
          # 24.04 sets the glibc floor at 2.39, so the deb and the AppImage
          # need Ubuntu 24.04 / Linux Mint 22 or newer. 22.04 is deliberately
          # not supported.
          - platform: ubuntu-24.04
            args: '--bundles deb,appimage'
          - platform: macos-latest
            args: '--target universal-apple-darwin --bundles app,dmg'
          - platform: windows-latest
            args: '--bundles nsis'

    runs-on: ${{ matrix.platform }}
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file \
            build-essential libssl-dev

      # Installs pnpm (version from package.json's "packageManager"), node, and
      # runs the install itself -- frozen lockfile, because CI is set.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Bundles are selected per platform above rather than from
      # tauri.conf.json, so a host can never emit a target we do not ship
      # (notably rpm, which is deliberately not supported).
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Run this by hand and nothing is released: with no tag there is no
          # release to create, and the bundles land as workflow artifacts to
          # download and try. A tag push does both.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Google Chat {0}', github.ref_name) || '' }}
          releaseBody: |
            Builds are unsigned. macOS will need right-click > Open on first
            launch; Windows will show a SmartScreen warning.
          releaseDraft: true
          prerelease: false
          uploadWorkflowArtifacts: true
          # There is no updater in this app, so there is nothing to sign or
          # publish a manifest for.
          uploadUpdaterJson: false
          args: ${{ matrix.args }}
