name: ci

on:
  push:
    branches: [main]
  pull_request:

# Nothing here writes anything back.
permissions:
  contents: read

# A newer push to the same branch or pull request makes an in-flight check
# pointless, so let it go.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf file \
            build-essential libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # chat.js has no build step, so nothing else would catch a syntax error
      # before it reaches the page. Only node itself is needed for that, hence
      # no install: there is nothing in node_modules this job uses.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Check injected script parses
        run: node --check src-tauri/src/inject/chat.js
