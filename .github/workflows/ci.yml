name: ci

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'scripts/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/ci.yml'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Only what the runner image lacks. build-essential, libssl-dev, patchelf
      # and file all ship on ubuntu-24.04 already; listing them just invites apt
      # to spend time upgrading them. If a future runner image drops one, the
      # build breaks here rather than silently -- add it back at that point.
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Format
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check

      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

      - name: Test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      # chat.js has no build step, so nothing else would catch a syntax error
      # before it reaches the page. Only node itself is needed for that, hence
      # no install: there is nothing in node_modules this job uses.
      - name: Install Node
        uses: pnpm/setup@v2
        with:
          runtime: node@24
          install: false

      - name: Check injected script parses
        run: node --check src-tauri/src/inject/chat.js

      - name: Check injected script behaves
        run: node scripts/chatjs-test.js
